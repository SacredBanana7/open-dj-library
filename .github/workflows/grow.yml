name: Katalog wachsen lassen
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  grow:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # three genres per night, rotating by day of year
      - name: Neue Tracks analysieren
        run: |
          G=(techno house dnb dubstep trance hiphop disco electro breaks electronica ambient experimental)
          D=$(date +%j); D=$((10#$D))
          for k in 0 1 2; do
            node tools/add-tracks.mjs --genre ${G[$(( (D*3 + k) % ${#G[@]} ))]} --count 15 || true
          done
          node tools/build-catalog.mjs
      - name: Committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898288+github-actions[bot]@users.noreply.github.com"
          git add tracks catalog.json
          git diff --cached --quiet || (git commit -m "Katalog: neue Tracks $(date +%F)" && git push)
